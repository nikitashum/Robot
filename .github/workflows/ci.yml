name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: new CVEs appear without any code change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ButikkPilot.slnx

      - name: Fail on vulnerable packages (direct and transitive)
        shell: bash
        run: |
          dotnet list ButikkPilot.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable NuGet packages found"; exit 1
          fi

      - name: Build (warnings are errors)
        run: dotnet build ButikkPilot.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ButikkPilot.slnx -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Publish the single-folder demo and smoke test every served file
        shell: pwsh
        run: |
          ./scripts/publish.ps1
          ./scripts/smoke.ps1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: "**/*.trx"

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t butikkpilot:ci .

      - name: Run image and probe it
        run: |
          docker run -d --name bp -p 8080:8080 butikkpilot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then ok=1; break; fi
            sleep 1
          done
          [ "${ok:-0}" = 1 ] || { docker logs bp; exit 1; }
          curl -fsS http://localhost:8080/ | grep -qi "ButikkPilot"
          # must not run as root
          test "$(docker inspect -f '{{.Config.User}}' butikkpilot:ci)" != "root"
